    <style>
        body { font-family: -apple-system, system-ui; background: #F2F2F7; margin:0; user-select: none; }

        /* 🔒 鎖定畫面 */
        #lock-screen {
            position: fixed; width:100%; height:100%;
            background:#F2F2F7;
            display:flex; align-items:center; justify-content:center;
            z-index: 999;
        }
        .lock-box {
            background:white; padding:30px; border-radius:20px;
            text-align:center; width:80%; max-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        input { width:90%; padding:15px; margin:20px 0; font-size:18px; text-align:center; border:1px solid #ddd; border-radius:10px; }
        button { padding:15px; width:100%; border:none; background:#007AFF; color:white; border-radius:10px; cursor:pointer; font-weight:bold; }
        button:active { background:#0051a7; }

        /* 主畫面 */
        #main-wrapper { display:none; }
        .container { padding:10px; }
        table { width:100%; background:white; border-radius:12px; border-collapse: collapse; overflow: hidden; }
        td, th { padding:12px 10px; text-align:center; border-bottom: 1px solid #eee; }
        th { background: #f8f8f8; font-size: 14px; }

        /* 狀態樣式 */
        .row-opened { background-color: #F2F2F7 !important; color: #AEAEB2; }
        .opened-tag { font-size: 10px; color: #8E8E93; font-weight: normal; }
        .item-info { text-align:left; line-height: 1.4; }
        .tag-danger { color:#FF3B30; font-weight: bold; }
        .tag-warning { color:#FF9500; }
        .emoji-btn { font-size:26px; cursor:pointer; }

        /* ✅ 顯示視窗 */
        #display-zone {
            display:none;
            position: fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(255,255,255,0.95); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .qr-fixed-box { width:180px; aspect-ratio:1/1; margin: 10px auto; background:#fff; border: 1px solid #eee; }
        #img-qr { display:block; width:100%; height:100%; object-fit:contain; }
        .bar-container { width: 220px; margin: 10px auto; }
        #img-bar { width:100%; height:auto; display:block; }
        .code-box { font-family:monospace; font-size:20px; margin:20px; padding: 15px; background: #eee; border-radius: 8px; letter-spacing: 1px; }
        .close-btn { background:#8E8E93; width:150px; margin-top: 20px; }
    </style>
</head>

<div id="lock-screen">

</div>

</div>

/* 🔓 1. 每次進網頁都要求密碼 (無 localStorage) */
function unlock() {
    const input = document.getElementById('pw-input').value;
    if (input === CORRECT_PASS) {
        showMain();
    } else {
        alert("密碼錯誤，存取拒絕");
        document.getElementById('pw-input').value = "";
    }
}

/* 鍵盤 Enter 支援 */
document.getElementById('pw-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') unlock();
});

function showMain() {
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('main-wrapper').style.display='block';
    renderTickets();
}

/* 🚀 2. 排序並渲染清單 */
function renderTickets() {
    const today = new Date();
    document.getElementById("title").innerHTML = 
        `<span style="font-size:14px; color:#666;">${today.toLocaleDateString()}</span><br>有效票券：${data.length} 張`;

    const sorted = [...data].sort((a,b)=>{
        const da=new Date(a.date);
        const db=new Date(b.date);
        const diffA=(da-today)/86400000;
        const diffB=(db-today)/86400000;
        const p = d => d<0?4:d<=1?1:d<=7?2:3;
        if(p(diffA)!==p(diffB)) return p(diffA)-p(diffB);
        return da-db;
    });

    let html="";
    sorted.forEach(item=>{
        const d=new Date(item.date);
        const diff=(d-today)/86400000;
        const isOpened = sessionOpenedTickets.includes(item.id);

        let tagClass = "";
        let tagText = "";
        if(diff<0) { tagClass="tag-danger"; tagText="❌過期"; }
        else if(diff<=1) { tagClass="tag-danger"; tagText="🔥明天到期"; }
        else if(diff<=7) { tagClass="tag-warning"; tagText="⚠️7天內"; }

        html+=`
        <tr id="row-${item.id}" class="${isOpened ? 'row-opened' : ''}">
            <td style="font-size:12px; color:#999;">${item.id}</td>
            <td style="font-size:13px;">${item.date}</td>
            <td class="item-info">
                <div style="font-weight:500;">${item.name}</div>
                ${isOpened ? '<span class="opened-tag"> [已開啟]</span>' : ''}
                <div class="${tagClass}" style="font-size:11px;">${tagText}</div>
            </td>
            <td><span class="emoji-btn" onclick="showTicket(${item.id}, '${item.code}','${item.name}')">🎫</span></td>
        </tr>`;
    });

    document.getElementById('ticket-list').innerHTML=html;
}

/* 🎫 3. 顯示票券邏輯 (僅暫存於變數) */
function showTicket(id, code, name){
    if (!sessionOpenedTickets.includes(id)) {
        sessionOpenedTickets.push(id);
        renderTickets(); // 立即重新渲染顯示「已開」標記
    }

    $("#p-title").text(name);
    $("#p-code").text(code);

    // 生成條碼 URL
    $("#img-qr").attr("src", `https://m.momoshop.com.tw/mymomo/ajaxProduceImage.jsp?code=${code}&type=0`);
    $("#img-bar").attr("src", `https://m.momoshop.com.tw/mymomo/ajaxProduceImage.jsp?code=${code}&type=1`);

    $("#display-zone").css("display", "flex");
}

/* 📋 4. 健壯複製功能 */
function copyValue(){
    const text = $("#p-code").text();
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    try {
        document.execCommand('copy');
        alert("代碼已複製到剪貼簿");
    } catch (err) {
        alert("複製失敗，請手動選取");
    }
    document.body.removeChild(textArea);
}
