<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>我的好康券 - uniopen</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        :root { --brand-red: #e60012; --bg-gray: #f7f7f7; --text-main: #333; }
        body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--bg-gray); margin: 0; color: var(--text-main); }
        
        /* 🔒 鎖定畫面 */
        #lock-screen { position: fixed; width: 100%; height: 100%; background: var(--bg-gray); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .lock-box { background: white; padding: 40px 24px; border-radius: 24px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
        .lock-box h2 { color: var(--brand-red); margin: 0 0 10px; font-size: 24px; }
        input[type="password"] { width: 100%; padding: 14px; margin: 20px 0; font-size: 18px; text-align: center; border: 1px solid #eee; border-radius: 12px; box-sizing: border-box; background: #fafafa; outline: none; }
        .btn-red { padding: 14px; width: 100%; border: none; background: var(--brand-red); color: white; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }

        /* 主頁面樣式 */
        #main-wrapper { display: none; }
        .nav-bar { background: white; padding: 16px; text-align: center; font-weight: bold; font-size: 18px; border-bottom: 1px solid #efefef; position: sticky; top: 0; z-index: 100; }
        
        .container { padding: 16px; }
        .search-input { width: 100%; padding: 12px 20px; border: 1px solid #ddd; border-radius: 50px; margin-bottom: 16px; box-sizing: border-box; outline: none; font-size: 14px; background: white; }
        
        .ticket-list-table { width: 100%; background: white; border-radius: 16px; border-collapse: collapse; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .ticket-list-table th { background: #fcfcfc; padding: 12px; font-size: 12px; color: #999; font-weight: normal; border-bottom: 1px solid #f5f5f5; }
        .ticket-list-table td { padding: 16px 12px; text-align: center; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        .row-opened { background: #f9f9f9 !important; color: #ccc; }
        .opened-tag { font-size: 10px; color: #ff9500; font-weight: bold; margin-left: 5px; }
        .btn-view { background: #007aff; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 16px; }

        /* 🎫 彈出票券：仿官網排版 */
        #display-zone { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .uni-card { background: white; width: 90%; max-width: 360px; border-radius: 24px; overflow: hidden; position: relative; animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .card-header { background: var(--brand-red); color: white; padding: 14px; text-align: center; position: relative; }
        .card-header h3 { margin: 0; font-size: 16px; }
        .card-header::after { content: ""; position: absolute; bottom: -20px; left: 0; width: 100%; height: 40px; background: white; border-radius: 50% 50% 0 0; }

        .card-body { padding: 10px 24px 30px; text-align: center; background: white; }
        .prod-image-box { width: 130px; height: 130px; margin: 0 auto 15px; padding: 10px; border: 1px solid #f0f0f0; border-radius: 16px; box-sizing: border-box; }
        .prod-image-box img { width: 100%; height: 100%; object-fit: contain; }
        .prod-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .acc-badge { background: #009688; color: white; padding: 2px 12px; border-radius: 50px; font-size: 12px; margin-bottom: 20px; display: inline-block; }

        .barcode-section { background: white; border: 1px solid #eee; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .barcode-img { width: 100%; height: 70px; margin: 8px 0; }
        .code-label { font-size: 11px; color: #999; font-weight: bold; }
        .code-val { font-family: monospace; font-size: 15px; font-weight: bold; color: #000; }
        .dash-line { border-top: 1px dashed #ddd; margin: 15px 0; }

        .rules-footer { text-align: left; background: #fafafa; padding: 16px; border-radius: 12px; font-size: 12px; line-height: 1.6; color: #666; }
        .btn-back { margin-top: 20px; width: 100%; padding: 15px; border: none; background: #f0f0f0; color: #333; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>

<div id="lock-screen">
    <div class="lock-box">
        <h2>uniopen</h2>
        <p style="color:#666; font-size:14px; margin:0;">我的好康券 - 分享專區</p>
        <input type="password" id="pw-input" placeholder="請輸入解鎖密碼">
        <button class="btn-red" onclick="unlock()">確認解鎖</button>
    </div>
</div>

<div id="main-wrapper">
    <div class="nav-bar">我的好康券</div>
    <div class="container">
        <input type="text" id="search" class="search-input" placeholder="🔍 搜尋帳號關鍵字..." onkeyup="filter()">
        <table class="ticket-list-table">
            <thead>
                <tr>
                    <th width="50">ID</th>
                    <th style="text-align:left;">帳號名稱</th>
                    <th width="80">操作</th>
                </tr>
            </thead>
            <tbody id="ticket-list"></tbody>
        </table>
        
        <div style="text-align: center; margin-top: 40px;">
            <span style="color:#aaa; font-size:12px; cursor:pointer;" onclick="resetLock()">🔒 手動鎖定頁面</span>
        </div>
    </div>
</div>

<div id="display-zone" onclick="closeModal()">
    <div class="uni-card" onclick="event.stopPropagation()">
        <div class="card-header"><h3>04 / 08【週三 i 好康】</h3></div>
        <div class="card-body">
            <div class="prod-image-box">
                <img src="https://cdn.uniopen.com/coupons/MOD_COUPON_288x288_1773717010183.png">
            </div>
            <div class="prod-title">茶裏王伯爵紅茶 600ml</div>
            <div id="p-acc" class="acc-badge"></div>
            
            <div class="barcode-section">
                <div class="code-label">主條碼 (c1)</div>
                <img id="img-c1" class="barcode-img">
                <div id="txt-c1" class="code-val"></div>
                <div class="dash-line"></div>
                <div class="code-label">備用代碼條碼 (c2)</div>
                <img id="img-c2" class="barcode-img">
                <div id="txt-c2" class="code-val"></div>
            </div>

            <div class="rules-footer">
                <strong>使用期限：</strong> 2026/05/07 23:59 止<br>
                <strong>注意事項：</strong> 條碼經刷讀完成後即失效。
            </div>
            <button class="btn-back" onclick="closeModal()">返回列表</button>
        </div>
    </div>
</div>

<script>
const PASS = "2724203";
let openedTickets = []; // 關鍵 1：領取紀錄不儲存

// 19 組帳號數據
const tickets = [
    {id: 8, acc: "丸0916334169", c1: "7500093109169906", c2: "HD4JOR6F"},
    {id: 9, acc: "丸0926909756", c1: "7500093109335234", c2: "61752DHS"},
    {id: 10, acc: "丸0952218216", c1: "7500093109234224", c2: "4786NJCJ"},
    {id: 11, acc: "丸0960633454", c1: "7500093109207551", c2: "YMHN0NJ5"},
    {id: 12, acc: "丸0965186198", c1: "7500093109129019", c2: "G7K6U5WH"},
    {id: 13, acc: "丸0965314778", c1: "7500093109285567", c2: "33NWMMCR"},
    {id: 14, acc: "丸0966824396", c1: "7500093109160643", c2: "X6VP7U42"},
    {id: 15, acc: "丸0971260012", c1: "7500093109409679", c2: "HJAXY7SI"},
    {id: 16, acc: "丸0975546910", c1: "7500093109388585", c2: "TMQE3008"},
    {id: 17, acc: "丸0989721451", c1: "7500093109064005", c2: "BPP75PV2"},
    {id: 18, acc: "丸0989728779", c1: "750009267785", c2: "YUCUMUWB"},
    {id: 19, acc: "丸0989809544", c1: "7500093109120847", c2: "J6YBRSYL"}
];

function unlock() {
    if ($("#pw-input").val() === PASS) {
        localStorage.setItem('uni_wallet_unlocked', 'true'); // 關鍵 2：解鎖狀態儲存
        showMain();
    } else { alert("密碼錯誤"); }
}

function showMain() {
    $("#lock-screen").hide();
    $("#main-wrapper").show();
    render();
}

function resetLock() {
    localStorage.removeItem('uni_wallet_unlocked');
    location.reload();
}

function render() {
    let html = "";
    tickets.forEach(t => {
        const isOpened = openedTickets.includes(t.id);
        html += `<tr class="${isOpened ? 'row-opened' : ''}">
            <td>${t.id}</td>
            <td style="text-align:left; font-weight:500;">${t.acc}${isOpened ? '<span class="opened-tag">(已開)</span>' : ''}</td>
            <td><button class="btn-view" onclick="show(${t.id})">🎫</button></td>
        </tr>`;
    });
    $("#ticket-list").html(html);
}

function show(id) {
    const item = tickets.find(x => x.id == id);
    if (!openedTickets.includes(id)) {
        openedTickets.push(id);
        render();
    }
    $("#p-acc").text(item.acc);
    $("#txt-c1").text(item.c1);
    $("#txt-c2").text(item.c2);
    $("#img-c1").attr("src", `https://bwipjs-api.metafloor.com/?bcid=code128&text=${item.c1}&scale=2`);
    $("#img-c2").attr("src", `https://bwipjs-api.metafloor.com/?bcid=code128&text=${item.c2}&scale=2`);
    $("#display-zone").css("display", "flex");
}

function closeModal() { $("#display-zone").hide(); }

function filter() {
    let val = $("#search").val().toLowerCase();
    $("#ticket-list tr").filter(function() {
        $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
    });
}

// 自動檢查解鎖狀態 (F5 重新整理後會自動進入清單)
if (localStorage.getItem('uni_wallet_unlocked') === 'true') { showMain(); }
</script>
</body>
</html>
