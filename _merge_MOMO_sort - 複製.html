    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #F2F2F7; margin: 0; padding-bottom: 50px; }
        
        /* 頂部固定顯示區 */
        #display-zone {
            position: sticky; top: 0; background: white; z-index: 1000;
            border-bottom: 1px solid #C6C6C8; padding: 15px; text-align: center;
            display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #img-qr { width: 140px; margin-bottom: 10px; }
        #img-bar { width: 90%; max-width: 320px; height: 60px; display: block; margin: 0 auto; }
        .code-box { 
            background: #F2F2F7; padding: 8px; border-radius: 6px; 
            font-family: monospace; font-size: 18px; margin: 10px 0; display: inline-block;
        }

        /* 表格排版 */
        .container { padding: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #E5E5EA; padding: 12px 5px; font-size: 13px; }
        td { border-bottom: 1px solid #E5E5EA; padding: 12px 8px; font-size: 14px; text-align: center; }
        .text-left { text-align: left; font-size: 13px; color: #333; }
        
        /* 狀態標籤 */
        .emoji { font-size: 30px; cursor: pointer; -webkit-user-select: none; }
        .expired { color: #FF3B30; font-weight: bold; }
        .row-active { background-color: #FFF9C4 !important; }
        .close-btn { background: #007AFF; color: white; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600; margin-top: 10px; }

        @media screen and (max-width: 480px) {
            .hide-mobile { display: none; }
            td { padding: 10px 4px; }
        }
    </style>
</head>

// 解鎖功能
function unlock() {
    const input = document.getElementById('pw-input').value;
    if (input === CORRECT_PASS) {
        $("#lock-screen").fadeOut(300);
        $("#main-wrapper").show();
        renderTickets();
    } else {
        alert("密碼不正確");
        document.getElementById('pw-input').value = "";
    }
}

// 渲染票券清單
function renderTickets() {
    let html = "";
    const today = new Date("2026-05-01"); // 當前模擬日期
    
    data.forEach(item => {
        const expDate = new Date(item.date);
        const isExpired = expDate < today;
        const isUrgent = (expDate - today) / (1000 * 60 * 60 * 24) <= 1; // 1天內到期
        
        html += `<tr class="${isExpired ? 'hide-mobile' : ''}">
                    <td>${item.id}</td>
                    <td class="hide-mobile ${isExpired || isUrgent ? 'expired-text' : ''}">${item.date}</td>
                    <td class="item-info">
                        <span class="item-name ${isExpired || isUrgent ? 'expired-text' : ''}">${item.name}</span>
                        <span class="item-date hide-mobile">到期日: ${item.date}</span>
                    </td>
                    <td><span class="emoji-btn" onclick="showTicket('${item.code}', '${item.name}')">🎫</span></td>
                </tr>`;
    });
    document.getElementById('ticket-list').innerHTML = html;
}

// 顯示條碼面板
function showTicket(code, name) {
    // 醒目顯示選中行
    $('tr').removeClass('row-selected');
    $(`.emoji-btn[onclick*="${code}"]`).closest('tr').addClass('row-selected');

    // 更新面板內容
    $("#p-title").text(name);
    $("#p-code").text(code);
    $("#img-qr").attr("src", `https://m.momoshop.com.tw/mymomo/ajaxProduceImage.jsp?code=${code}&type=0`);
    $("#img-bar").attr("src", `https://m.momoshop.com.tw/mymomo/ajaxProduceImage.jsp?code=${code}&type=1`);
    
    $("#display-zone").slideDown(200);
    window.scrollTo({top: 0, behavior: 'smooth'});
}

// 複製序號
function copyValue() {
    const text = document.getElementById("p-code").innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("已複製序號: " + text);
    }).catch(err => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        alert("已複製序號");
    });
}

// 監聽 Enter 鍵
document.getElementById('pw-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') unlock();
});
</script>
